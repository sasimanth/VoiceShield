# ============================================================
# APPLICATION METADATA
# ============================================================
spring.application.name=voiceshield-backend

# ============================================================
# DATASOURCE CONFIGURATION
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/VoiceShield
spring.datasource.username=postgres
spring.datasource.password=Syed@Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA & HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# ACTUATOR & MONITORING
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# DATABASE CONNECTION POOL (HikariCP)
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# EXTERNAL SERVICES (ML Inference Engine)
# ============================================================
ml.service.url=${ML_SERVICE_URL:http://localhost:8001}