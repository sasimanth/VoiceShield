# ============================================================
# APPLICATION METADATA
# ============================================================
spring.application.name=voiceshield-backend
management.info.env.enabled=true

info.app.name=VoiceShield
info.app.description=AI-Powered Real-Time Voice Integrity Verification Framework
info.app.version=1.0.0

# ============================================================
# DATASOURCE CONFIGURATION
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/VoiceShield}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA & HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# ACTUATOR & MONITORING
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# DATABASE CONNECTION POOL (HikariCP)
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# EXTERNAL SERVICES (ML Inference Engine)
# ============================================================
ml.service.url=${ML_SERVICE_URL:http://localhost:8001}

# ============================================================
# SPEAKER VERIFICATION THRESHOLD
# ============================================================
voiceshield.speaker-verification.threshold=${VOICESHIELD_SPEAKER_THRESHOLD:0.4000}