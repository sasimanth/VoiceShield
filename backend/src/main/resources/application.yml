server:
  port: 8080

spring:
  application:
    name: voiceshield-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/voiceshield_db
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

voiceshield:
  ml-service:
    url: http://localhost:8001
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  speaker-verification:
    similarity-threshold: 0.4000
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.voiceshield: DEBUG
