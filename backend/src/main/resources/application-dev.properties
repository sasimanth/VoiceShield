# Development Profile Overrides (H2 in-memory DB for local testing without PostgreSQL)
spring.datasource.url=jdbc:h2:mem:voiceshield_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.com.voiceshield=INFO