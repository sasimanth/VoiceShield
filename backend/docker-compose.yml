services:
  postgres:
    image: postgres:17-alpine
    container_name: voiceshield-postgres
    environment:
      POSTGRES_DB: VoiceShield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be provided}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d VoiceShield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: voiceshield-backend:1.0.0
    container_name: voiceshield-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/VoiceShield
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD environment variable must be provided}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: